name: Build English pages

# Regenerates en/*.html whenever a bilingual source page or the generator changes,
# so the English URLs never drift from the Russian source.
on:
  push:
    branches: [main]
    paths:
      - boracay.html
      - flights.html
      - accommodation.html
      - tours.html
      - places.html
      - restaurants.html
      - connectivity.html
      - travel-guide.html
      - health-safety.html
      - local-services.html
      - commercial.css
      - weather.html
      - currency.html
      - beaches.html
      - en/beaches.html
      - sitemap.xml
      - tools/build_en.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-en
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate en/
        run: python3 tools/build_en.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en
          if git diff --cached --quiet; then
            echo "en/ already up to date"
          else
            git commit -m "Regenerate English pages"
            git pull --rebase origin main
            git push
          fi
