<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Boracay and the Monsoons</title><desc id="desc">A schematic map of Boracay showing northeast Amihan winds exposing Bulabog Beach on the east and sheltering White Beach on the west, and southwest Habagat winds exposing White Beach and generally sheltering Bulabog.</desc>
<defs>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#b8e5e8"/><stop offset="1" stop-color="#4da9b5"/></linearGradient>
 <linearGradient id="island" x2="1" y2="1"><stop stop-color="#6eaa65"/><stop offset="1" stop-color="#2e765c"/></linearGradient>
 <marker id="arrNE" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087fba"/></marker>
 <marker id="arrSW" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d47737"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#163d48" flood-opacity=".15"/></filter>
</defs>
<rect width="1600" height="900" rx="28" fill="#f4f8f5"/>
<rect x="24" y="24" width="1552" height="852" rx="24" fill="url(#sea)"/>
<path d="M24 150Q300 100 560 150T1100 140T1576 130V24H24Z" fill="#e9f4ee" opacity=".7"/>
<text x="70" y="95" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#123b50">BORACAY &amp; THE MONSOONS</text>
<text x="72" y="140" font-family="Arial,sans-serif" font-size="25" fill="#315e6b">How seasonal wind direction changes exposure on opposite coasts</text>
<!-- Island schematic -->
<path d="M735 190 C665 215 625 300 630 390 C634 480 670 560 700 650 C727 730 785 785 845 760 C900 735 928 660 950 575 C976 480 1000 390 972 305 C947 230 866 170 790 180Z" fill="url(#island)" stroke="#f8f3d6" stroke-width="18" filter="url(#shadow)"/>
<path d="M622 330 C600 410 630 520 682 605" fill="none" stroke="#fff4d5" stroke-width="18" stroke-linecap="round"/>
<path d="M980 320 C1015 420 990 540 944 625" fill="none" stroke="#f5e7bf" stroke-width="18" stroke-linecap="round"/>
<path d="M636 365 C625 445 653 525 690 585" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
<path d="M973 350 C995 440 970 535 940 600" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
<text x="805" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#fff">BORACAY</text>
<text x="805" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#eff8dc">ISLAND</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#124c63">WHITE BEACH</text>
<text x="500" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#124c63">WEST COAST</text>
<text x="1110" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#124c63">BULABOG BEACH</text>
<text x="1110" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#124c63">EAST COAST</text>
<!-- wind arrows -->
<path d="M1340 250 C1220 260 1135 300 1010 360" stroke="#087fba" stroke-width="16" fill="none" marker-end="url(#arrNE)" stroke-linecap="round"/>
<path d="M1280 180 C1165 200 1090 250 1000 305" stroke="#087fba" stroke-width="10" fill="none" marker-end="url(#arrNE)" stroke-linecap="round" opacity=".75"/>
<text x="1320" y="115" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#075f91">NE WIND</text>
<text x="1320" y="153" font-family="Arial,sans-serif" font-size="24" fill="#075f91">AMIHAN</text>
<path d="M255 620 C380 590 470 540 610 500" stroke="#d47737" stroke-width="16" fill="none" marker-end="url(#arrSW)" stroke-linecap="round"/>
<path d="M255 700 C390 670 490 610 640 555" stroke="#d47737" stroke-width="10" fill="none" marker-end="url(#arrSW)" stroke-linecap="round" opacity=".75"/>
<text x="100" y="565" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#9b4d1d">SW WIND</text>
<text x="100" y="603" font-family="Arial,sans-serif" font-size="24" fill="#9b4d1d">HABAGAT</text>
<!-- panels -->
<rect x="70" y="190" width="430" height="270" rx="22" fill="#fff" opacity=".94" filter="url(#shadow)"/>
<rect x="70" y="190" width="430" height="58" rx="22" fill="#c16a35"/>
<text x="98" y="229" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">HABAGAT · SOUTHWEST MONSOON</text>
<text x="100" y="290" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#193e4d">White Beach / west coast</text>
<text x="100" y="330" font-family="Arial,sans-serif" font-size="22" fill="#315968">Direct wind and wave exposure</text>
<text x="100" y="365" font-family="Arial,sans-serif" font-size="22" fill="#315968">Stronger surf; water may be less clear</text>
<text x="100" y="415" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#39715e">Bulabog is generally more sheltered</text>
<rect x="1100" y="500" width="430" height="270" rx="22" fill="#fff" opacity=".94" filter="url(#shadow)"/>
<rect x="1100" y="500" width="430" height="58" rx="22" fill="#087fba"/>
<text x="1128" y="539" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">AMIHAN · NORTHEAST MONSOON</text>
<text x="1130" y="600" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#193e4d">Bulabog / east coast</text>
<text x="1130" y="640" font-family="Arial,sans-serif" font-size="22" fill="#315968">Direct northeast wind and wave exposure</text>
<text x="1130" y="675" font-family="Arial,sans-serif" font-size="22" fill="#315968">Typical conditions for kite / windsurfing</text>
<text x="1130" y="725" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#39715e">White Beach is generally more sheltered</text>
<!-- caveat -->
<rect x="520" y="790" width="560" height="54" rx="14" fill="#123b50"/>
<text x="800" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#fff">Schematic exposure guide · local conditions vary by beach and day</text>
</svg>